<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awan Courier — Island Parcel Run</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0f16;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    background: #2f6fb4;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="800"></canvas></div>
<script type="module">
  import { boot } from './src/main.js';
  const canvas = document.getElementById('game');
  boot(canvas);
</script>
</body>
</html>
